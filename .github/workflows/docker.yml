# Publish the container image to GHCR: one native build per architecture
# (no QEMU — GitHub's arm64 hosted runners build arm64 for real, which also
# lets each image be smoke-tested on its own architecture before anything is
# tagged), each pushed by digest, then stitched into one multi-arch manifest
# list by the merge job.
#
# The default GITHUB_TOKEN with packages:write is enough — no repository
# setting has to exist beforehand. The first push creates the package private;
# making it public (and linking it to the repository) is a one-time flip in
# the package's settings on GitHub.
name: docker

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only here. Tags are forbidden alongside push-by-digest; the
      # merge job owns them.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # The QEMU pattern could never do this: run the freshly built image on
      # real hardware of its own architecture. `check` exercises startup,
      # registry parsing, and validation — a broken binary fails here, before
      # any tag exists for anyone to pull.
      - name: Smoke test natively
        run: |
          docker run --rm \
            -v "$PWD/examples/docker/routes.json:/etc/patchbay/routes.json:ro" \
            "$IMAGE@${{ steps.build.outputs.digest }}" check

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` tracks main; a v* tag also publishes its own version tag.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and push the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf -- "$IMAGE@sha256:%s " *)

      - name: Inspect the result
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
